name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # release.yml runs these same gates before it publishes anything.
  workflow_call:

# Least privilege at the workflow level; no job here needs more. Without this the workflow
# inherits the repository/organization default, which may be write-all.
permissions:
  contents: read

# Successive pushes to the same ref supersede each other instead of queueing runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The two job names below are required status checks on master. Renaming one silently removes
  # the gate, so it is a decision, not an edit (D-107).
  default:
    name: default
    runs-on: ubuntu-latest
    # The suite starts subprocesses, including a fake ripwire that sleeps 30 s, memory
    # supervisors and watch processes. Without a timeout a hung test holds the runner.
    timeout-minutes: 20
    steps:
      # Actions are pinned by full commit SHA: a tag is mutable, a SHA is not.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keeps GITHUB_TOKEN out of .git/config, where every later step could read it.
          persist-credentials: false
      # nextest does not run doctests; this crate has none, so nothing is lost.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      # The tests that need the real binary return early without it (`require_ripwire!`) and
      # pass having tested nothing. Deliberately the latest release, not a pin, unlike the rest of
      # this file: these runs exist to catch a new ripwire breaking the integration (D-188). The
      # binary is checked against the release's own checksum; no remote script runs.
      - name: ripwire (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download --repo redhat-et/ripwire \
            --pattern 'ripwire-*-linux-x64.tar.gz' --pattern 'ripwire-*-linux-x64.tar.gz.sha256'
          sha256sum -c ripwire-*-linux-x64.tar.gz.sha256
          tar -xzf ripwire-*-linux-x64.tar.gz
          install -D ripwire-*-linux-x64/ripwire "$HOME/.local/bin/ripwire"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ripwire" --version
      # The steps live in the script, so a PR's checks are one local command (ai-native plan,
      # step 6). It prints a log group per check. The timeout is shorter than the job's: a step
      # that runs out ends with its log kept, where a job cancelled at its own limit keeps none,
      # and the hung test could not be named (D-144).
      - name: Checks
        timeout-minutes: 12
        run: scripts/check.sh default

  online:
    name: online
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      # Same as in `default` (D-188).
      - name: ripwire (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download --repo redhat-et/ripwire \
            --pattern 'ripwire-*-linux-x64.tar.gz' --pattern 'ripwire-*-linux-x64.tar.gz.sha256'
          sha256sum -c ripwire-*-linux-x64.tar.gz.sha256
          tar -xzf ripwire-*-linux-x64.tar.gz
          install -D ripwire-*-linux-x64/ripwire "$HOME/.local/bin/ripwire"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ripwire" --version
      # The #[ignore] tests stay ignored: nextest does not run them without --run-ignored,
      # and the three in online_live.rs need RIPWIRE_BROKER_JEV_API_KEY, which no PR run has.
      - name: Checks
        timeout-minutes: 12
        run: scripts/check.sh online

  # The Claude Code plugin (spec/plan/mod-plan.md, T3.3, T4.2). Not a required check. It runs
  # without a login on a runner (PRs #75 and #76). The shape of the plugin's files and its scripts
  # are already tested by tests/plugin.rs in the two jobs above; this is Anthropic's own check of
  # the manifests, and the mod's tests through Claude Code's kit.
  plugin:
    name: plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The script fetches the pinned Claude Code through npx (CLAUDE_CODE_VERSION there, D-193)
      # and runs both manifests with --strict, then the mod's tests through Claude Code's test kit
      # (no session or sign-in).
      - name: Checks
        run: scripts/check.sh plugin
